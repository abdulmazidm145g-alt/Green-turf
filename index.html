 d+=`H${W-R}A${R},${R} 0 0 1 ${W},${y0+R}V${y0+H-R}A${R},${R} 0 0 1 ${W-R},${y0+H}H${R}A${R},${R} 0 0 1 0,${y0+H-R}V${y0+R}A${R},${R} 0 0 1 ${R},${y0}Z`;return d}
function draw(){const d=path();gl.style.clipPath=`path('${d}')`;mp.setAttribute('d',d);sp.setAttribute('d',d);st.setAttribute('d',d);ig.setAttribute('d',d);cp.setAttribute('d',d);lg.setAttribute('x2',W);lg.setAttribute('y2',TT+H)}
function size(){W=bot.clientWidth;g.querySelector('svg').setAttribute('width',W);g.querySelector('svg').setAttribute('height',TT+H);const a=bot.querySelector('a.on:not(.fab)');if(a&&!anim)cx=a.getBoundingClientRect().left-bot.getBoundingClientRect().left+a.offsetWidth/2;draw()}

const TINT=['rgba(255,170,225,.1)','rgba(255,170,190,.1)','rgba(200,170,255,.1)','rgba(160,210,255,.1)','rgba(170,240,210,.1)'];
let anim=0,lastOn=null;const ease=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function play(a,idx){const svg=a.querySelector('svg.ic');const br=bot.getBoundingClientRect(),ar=a.getBoundingClientRect();cx=ar.left-br.left+ar.width/2;
 g.style.setProperty('--tint',TINT[idx%TINT.length]);

 const my=++anim,t0=performance.now(),T1=240,T2=340,T3=420;

 if(reduce){h=0;draw();anim=0;return}
 (function fr(now){if(my!==anim)return;const t=now-t0;let iy=0,is=1;
  if(t<T1){const u=ease(t/T1);h=H_MAX*u;iy=-h;is=1-.35*Math.sin(u*Math.PI/2)}
  else if(t<T1+T2){const u=eio((t-T1)/T2);h=H_MAX*(1-u);iy=-h;is=.65+.35*u}
  else if(t<T1+T2+T3){const u=(t-T1-T2)/T3;h=0;iy=-18*Math.sin(Math.PI*u)*(1-u)*1.6;is=1+.12*Math.sin(Math.PI*u)}
  else{h=0;iy=0;is=1;anim=0;draw();if(svg){svg.style.removeProperty('--iy');svg.style.removeProperty('--is')}return}
  if(svg){svg.style.setProperty('--iy',iy.toFixed(1)+'px');svg.style.setProperty('--is',is.toFixed(3))}
  draw();requestAnimationFrame(fr)})(t0)}
function sync(){const items=[...bot.querySelectorAll('a')];const a=bot.querySelector('a.on');const p=a?a.dataset.p:null;
 if(p!==lastOn){const first=lastOn===null;lastOn=p;if(a&&!a.classList.contains('fab')&&!first){play(a,items.indexOf(a))}else{anim++;h=0;if(a&&!a.classList.contains('fab')){g.style.setProperty('--tint',TINT[items.indexOf(a)%TINT.length])}size()}}}
new MutationObserver(()=>{requestAnimationFrame(()=>{size();sync()})}).observe(bot,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
